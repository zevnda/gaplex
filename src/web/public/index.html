<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gaplex</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>Gaplex</h1>
        <span class="live-badge" id="live-badge"><span class="live-dot"></span>Live</span>
      </header>

      <section class="player-card">
        <div class="art-frame">
          <img id="art" class="art" alt="" hidden />
          <div class="art-placeholder" id="art-placeholder">&#9835;</div>
        </div>

        <div class="player-body">
          <div class="eyebrow">Now playing</div>
          <h2 class="title" id="current-title">Waiting for playback&hellip;</h2>

          <div class="progress">
            <div class="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-times">
              <span id="time-elapsed">0:00</span>
              <span id="time-remaining">&minus;0:00</span>
            </div>
          </div>

          <div class="controls">
            <div class="transport">
              <button id="play-pause" class="play-btn" disabled aria-label="Play">
                <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                  <path d="M8 5v14l11-7z" fill="currentColor" />
                </svg>
                <svg
                  id="icon-pause"
                  viewBox="0 0 24 24"
                  width="22"
                  height="22"
                  aria-hidden="true"
                  hidden
                >
                  <path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor" />
                </svg>
              </button>

              <button id="skip" class="icon-btn" aria-label="Skip current track">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M6 5v14l10-7zM17 5v14h2V5z" fill="currentColor" />
                </svg>
              </button>
            </div>

            <div class="volume-row">
              <button id="mute-toggle" class="icon-btn" aria-label="Mute">
                <svg id="icon-volume" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                  <path
                    d="M4 9v6h4l5 5V4L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 15.5 12z"
                    fill="currentColor"
                  />
                </svg>
                <svg
                  id="icon-mute"
                  viewBox="0 0 24 24"
                  width="16"
                  height="16"
                  aria-hidden="true"
                  hidden
                >
                  <path
                    d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.06l2.45 2.45c.03-.16.05-.32.05-.48zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.965 8.965 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H4v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"
                    fill="currentColor"
                  />
                </svg>
              </button>
              <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="Volume"
              />
            </div>
          </div>
        </div>
      </section>

      <section class="up-next-card">
        <div class="eyebrow">Up next</div>
        <div class="next-row">
          <img id="next-art" class="next-art" alt="" hidden />
          <div class="next-art-placeholder" id="next-art-placeholder">&#9835;</div>
          <div class="next-info">
            <div class="next-title" id="next-title">Not queued yet</div>
            <div class="next-duration" id="next-duration"></div>
          </div>
        </div>
      </section>

      <details class="settings-card">
        <summary>Stream settings</summary>
        <div class="settings-body">
          <p class="settings-hint">
            The URL your browser plays from &mdash; usually your Icecast mount, e.g.
            <code>http://your-icecast-host:8000/mount.mp3</code>. Saved only in this browser.
          </p>
          <div class="url-row">
            <input
              type="text"
              id="stream-url"
              placeholder="http://your-icecast-host:8000/mount.mp3"
            />
            <button id="save-url">Save</button>
          </div>
          <p class="status-line" id="status-line"></p>
        </div>
      </details>
    </div>

    <audio id="player" preload="none"></audio>
    <script src="/app.js"></script>
  </body>
</html>
